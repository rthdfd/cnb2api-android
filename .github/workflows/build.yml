name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnb2api-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK to repo
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/cnb2api-android-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/cnb2api-android-debug.apk
          git diff --cached --quiet && exit 0
          git commit -m "update debug APK [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin HEAD:main